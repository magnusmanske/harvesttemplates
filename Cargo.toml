[package]
name = "harvesttemplates"
version = "0.1.0"
edition = "2024"
license = "CC0-1.0"
description = "Harvest template parameters from Wikimedia projects into Wikidata"
repository = "https://github.com/magnusmanske/harvesttemplates"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.23"
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
dashmap = "6"
fancy-regex = "0.19"
futures = "0.3"
hmac = "0.13"
moka = { version = "0.12", features = ["future"] }
mysql_async = "0.37"
rand = "0.10"
regex = "1"
reqwest = { version = "0.13", features = ["json", "gzip", "form", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "fs", "timeout", "compression-gzip", "compression-br", "catch-panic", "set-header"] }
tower-sessions = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2"

[dev-dependencies]
tempfile = "3"
testcontainers-modules = { version = "0.15", features = ["mariadb"] }
tokio = { version = "1", features = ["test-util"] }
wiremock = "0.6"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
strip = "symbols"
